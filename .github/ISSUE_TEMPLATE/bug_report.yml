name: Bug report
description: Report something that does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rebax version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, macOS, Android, iOS, PlayStation 2, PlayStation 1, Other]
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture and device
      placeholder: "x86_64, ARM64, Pixel 8, ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error text or attach a screenshot.
