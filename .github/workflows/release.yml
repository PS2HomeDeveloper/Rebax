name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (leave empty to generate them automatically)
        required: false
        type: string
      prerelease:
        description: Mark as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install make
        shell: pwsh
        run: choco install -y make

      - name: Build
        shell: bash
        run: |
          "/c/ProgramData/chocolatey/lib/make/tools/install/bin/make.exe" windows ${{ matrix.arch }}

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Makefile -Pattern '^ENGINE_VERSION' | Select-Object -First 1).Line -replace '^ENGINE_VERSION\s*:=\s*', ''
          $name = "Rebax-Engine-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "build/output/$name" -DestinationPath "release/$name.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86, arm64, arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make linux ${{ matrix.arch }}

      - name: Package
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          name="Rebax-Engine-${version}-linux-${{ matrix.arch }}"
          mkdir -p release
          tar -C build/output -cJf "release/${name}.tar.xz" "$name"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the signing file
        env:
          ANDROID_SIGNING_BASE64: ${{ secrets.ANDROID_SIGNING_BASE64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_BASE64" ]; then
            echo "::error::The ANDROID_SIGNING_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_SIGNING_BASE64" | base64 -d > keystore/rebax_signing.pem

      - name: Build
        run: make android all

      - name: Package
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          mkdir -p release
          cp "build/output/Rebax-Engine-${version}-android-universal.apk" release/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: release/*
          if-no-files-found: error

  apple:
    name: macOS and iOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS
        run: |
          make macos arm64
          make macos x86_64

      - name: Build iOS
        run: make ios arm64

      - name: Package
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          base="Rebax-Engine-${version}-macos"
          mkdir -p release
          rm -rf "build/output/${base}-universal"
          cp -R "build/output/${base}-arm64" "build/output/${base}-universal"
          rm "build/output/${base}-universal/${base}-arm64"
          lipo -create "build/output/${base}-arm64/${base}-arm64" "build/output/${base}-x86_64/${base}-x86_64" -output "build/output/${base}-universal/${base}-universal"
          chmod +x "build/output/${base}-universal/${base}-universal"
          ditto -c -k --keepParent "build/output/${base}-universal" "release/${base}-universal.zip"
          cp "build/output/Rebax-Engine-${version}-ios-arm64.ipa" release/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [windows, linux, android, apple]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          ls -l packages
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$version" > /dev/null 2>&1; then
            gh release upload "$version" packages/* --clobber
            if [ -n "$NOTES" ]; then gh release edit "$version" --notes "$NOTES"; fi
          else
            if [ -n "$NOTES" ]; then
              gh release create "$version" packages/* --target "$GITHUB_SHA" --title "Rebax Engine ${version#v}" --notes "$NOTES" "${flags[@]}"
            else
              gh release create "$version" packages/* --target "$GITHUB_SHA" --title "Rebax Engine ${version#v}" --generate-notes "${flags[@]}"
            fi
          fi
