name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (leave empty to generate them automatically)
        required: false
        type: string
      prerelease:
        description: Mark as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, platform: android, arch: all }
          - { runner: ubuntu-26.04, platform: linux, arch: x86_64 }
          - { runner: ubuntu-26.04, platform: linux, arch: x86 }
          - { runner: ubuntu-26.04, platform: linux, arch: arm64 }
          - { runner: ubuntu-26.04, platform: linux, arch: arm }
          - { runner: windows-2025, platform: windows, arch: x86_64 }
          - { runner: windows-2025, platform: windows, arch: x86 }
          - { runner: windows-2025, platform: windows, arch: arm64 }
          - { runner: windows-2025, platform: windows, arch: arm }
          - { runner: macos-26-intel, platform: macos, arch: x86_64 }
          - { runner: macos-26-intel, platform: macos, arch: arm64 }
          - { runner: macos-26-intel, platform: ios, arch: x86_64 }
          - { runner: macos-26-intel, platform: ios, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y make

      - name: Install make on macOS
        if: runner.os == 'macOS'
        run: brew install make

      - name: Prepare the Android signing file
        if: matrix.platform == 'android'
        env:
          ANDROID_SIGNING_BASE64: ${{ secrets.ANDROID_SIGNING_BASE64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_BASE64" ]; then
            echo "::error::The ANDROID_SIGNING_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_SIGNING_BASE64" | base64 -d > keystore/rebax_signing.pem

      - name: Build
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) MAKE_BIN="/c/ProgramData/chocolatey/lib/make/tools/install/bin/make.exe" ;;
            macOS) MAKE_BIN=gmake ;;
            *) MAKE_BIN=make ;;
          esac
          "$MAKE_BIN" ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Package
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          base="Rebax-Engine-${version}-${{ matrix.platform }}"
          mkdir -p release
          case "${{ matrix.platform }}" in
            android) cp "build/output/${base}-universal.apk" release/ ;;
            ios) cp "build/output/${base}-${{ matrix.arch }}.ipa" release/ ;;
            linux) tar -C build/output -cJf "release/${base}-${{ matrix.arch }}.tar.xz" "${base}-${{ matrix.arch }}" ;;
            macos) ditto -c -k --keepParent "build/output/${base}-${{ matrix.arch }}" "release/${base}-${{ matrix.arch }}.zip" ;;
            windows) (cd build/output && 7z a -tzip "../../release/${base}-${{ matrix.arch }}.zip" "${base}-${{ matrix.arch }}" > /dev/null) ;;
          esac
          ls -l release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          ls -l packages
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$version" > /dev/null 2>&1; then
            gh release upload "$version" packages/* --clobber
            if [ -n "$NOTES" ]; then gh release edit "$version" --notes "$NOTES"; fi
          else
            if [ -n "$NOTES" ]; then
              gh release create "$version" packages/* --target "$GITHUB_SHA" --title "Rebax Engine ${version#v}" --notes "$NOTES" "${flags[@]}"
            else
              gh release create "$version" packages/* --target "$GITHUB_SHA" --title "Rebax Engine ${version#v}" --generate-notes "${flags[@]}"
            fi
          fi
