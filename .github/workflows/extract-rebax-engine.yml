name: Extract Rebax Engine

on:
  push:
    paths:
      - 'Rebax_Engine.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.deleted == false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and replace repository contents
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/Rebax_Engine.zip"
          EXTRACT_DIR="$RUNNER_TEMP/rebax-extracted"
          SOURCE_DIR="$EXTRACT_DIR/Rebax_Engine"

          test -f "$ARCHIVE"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Expected Rebax_Engine directory was not found in the ZIP archive."
            exit 1
          fi

          if [ -z "$(find "$SOURCE_DIR" -mindepth 1 -print -quit)" ]; then
            echo "The Rebax_Engine directory is empty."
            exit 1
          fi

          find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 -exec mv -t "$GITHUB_WORKSPACE" -- {} +

          rm -rf "$GITHUB_WORKSPACE/Rebax_Engine.zip"
          rm -rf "$GITHUB_WORKSPACE/Rebax_Engine"

          git add -A -f
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --cached --quiet && {
            echo "No changes to commit."
            exit 0
          }

          git commit -m "Extract Rebax Engine into repository root"
          git push origin HEAD:main
