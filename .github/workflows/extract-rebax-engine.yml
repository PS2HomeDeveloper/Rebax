name: Extract Rebax Engine

on:
  push:
    paths:
      - 'Rebax_Engine.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Rebax Engine
        run: |
          set -e

          EXTRACT_DIR="$RUNNER_TEMP/rebax-extracted"

          mkdir -p "$EXTRACT_DIR"

          if [ ! -f Rebax_Engine.zip ]; then
            echo "Error: Rebax_Engine.zip was not found."
            exit 1
          fi

          unzip -q Rebax_Engine.zip -d "$EXTRACT_DIR"

          SOURCE_DIR="$EXTRACT_DIR/Rebax_Engine"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Error: Rebax_Engine directory was not found."
            find "$EXTRACT_DIR" -maxdepth 4 -print
            exit 1
          fi

          if [ -z "$(find "$SOURCE_DIR" -mindepth 1 -print -quit)" ]; then
            echo "Error: The archive contains an empty Rebax_Engine directory."
            exit 1
          fi

          echo "Extracted project files:"
          find "$SOURCE_DIR" -maxdepth 3 -print

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'Rebax_Engine.zip' \
            -exec rm -rf {} +

          rsync -a "$SOURCE_DIR/" ./

          rm -f Rebax_Engine.zip

          if [ -z "$(find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -print -quit)" ]; then
            echo "Error: No project files were installed."
            exit 1
          fi

      - name: Commit extracted project
        run: |
          set -e

          git rm -r --cached --ignore-unmatch .
          git add -f .github
          git add -f .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status --short

          git commit -m "Replace repository with extracted Rebax Engine"
          git push
