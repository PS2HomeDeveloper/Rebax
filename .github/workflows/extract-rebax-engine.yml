name: Extract Rebax Engine

on:
  push:
    paths:
      - 'Rebax_Engine.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and replace repository contents
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/Rebax_Engine.zip"
          EXTRACT_DIR="$RUNNER_TEMP/rebax-extracted"
          SOURCE_DIR="$EXTRACT_DIR/Rebax_Engine"

          test -f "$ARCHIVE"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Error: Rebax_Engine directory not found in archive."
            exit 1
          fi

          if [ -z "$(find "$SOURCE_DIR" -mindepth 1 -print -quit)" ]; then
            echo "Error: Rebax_Engine directory is empty."
            exit 1
          fi

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          rm -f "$ARCHIVE"

          if [ ! -f "$GITHUB_WORKSPACE/Makefile" ] || [ ! -f "$GITHUB_WORKSPACE/README.md" ]; then
            echo "Error: Expected project files are missing."
            exit 1
          fi

          test -d "$GITHUB_WORKSPACE/src"

          echo "Final repository root:"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 \
            ! -name '.git' -print

          git add -A -f

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Error: No repository changes detected."
            exit 1
          fi

          git commit -m "Extract Rebax Engine into repository root"
          git push origin HEAD:main
