name: Build Rebax

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  windows:
    name: Windows
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        shell: pwsh
        run: |
          choco install -y 7zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      # Workaround for a real bug, not a build decision: the make.exe bundled
      # on this runner (C:\mingw64\bin\make.exe) crashes (STATUS_STACK_OVERFLOW)
      # when the Makefile tries to compile build_tools/ itself through
      # $(shell ...) - redirecting its output first did not help, so the
      # compiler is run here directly instead. Same command the Makefile
      # itself would run; if build_tools/rebax-tool.exe already exists the
      # Makefile skips building it and just uses this one.
      - name: Pre-build build_tools/rebax-tool.exe
        shell: bash
        run: |
          gcc -std=c99 -O2 -DZ7_ST -D_7ZIP_ST -D_POSIX_C_SOURCE=200809L \
            -o build_tools/rebax-tool.exe \
            build_tools/src/rebax_tool.c \
            build_tools/src/rebax_fs.c \
            build_tools/src/xz_embedded.c \
            build_tools/src/lzma2_encoder.c \
            -lm

      # Temporary diagnostic: isolate whether rebax-tool.exe itself crashes,
      # or whether it's specifically make's $(shell ...) wrapping around it,
      # since "make" now crashes right where it first calls
      # `build_tools/rebax-tool.exe which ...` for gcc/objcopy/pkg-config/curl.
      - name: Diagnose rebax-tool.exe which
        shell: bash
        run: |
          set -x
          build_tools/rebax-tool.exe which gcc
          build_tools/rebax-tool.exe which objcopy
          build_tools/rebax-tool.exe which curl
          echo "all three ran without crashing"

      - name: Build
        shell: bash
        run: |
          make

      - name: Compress build output
        shell: bash
        run: |
          mkdir -p release
          for file in build/output/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            7z a "release/${package}.7z" "$file"
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*.7z
          fail_on_unmatched_files: true


  linux:
    name: Linux
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            libsdl2-dev \
            curl \
            p7zip-full

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
