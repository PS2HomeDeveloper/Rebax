name: Build Rebax

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  windows:
    name: Windows
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        shell: pwsh
        run: |
          choco install -y 7zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          make

      - name: Compress build output
        shell: bash
        run: |
          mkdir -p release
          for file in build/output/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            7z a "release/${package}.7z" "$file"
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*.7z
          fail_on_unmatched_files: true

  linux:
    name: Linux
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            gcc-i686-linux-gnu \
            g++-i686-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            curl \
            p7zip-full

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Select Linux cross compiler for ${{ matrix.architecture }}
        run: |
          case "${{ matrix.architecture }}" in
            x86)
              echo "CC=i686-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CXX=i686-linux-gnu-g++" >> "$GITHUB_ENV"
              echo "OBJCOPY=i686-linux-gnu-objcopy" >> "$GITHUB_ENV"
              ;;
            x86_64)
              echo "CC=gcc" >> "$GITHUB_ENV"
              echo "CXX=g++" >> "$GITHUB_ENV"
              echo "OBJCOPY=objcopy" >> "$GITHUB_ENV"
              ;;
            arm64)
              echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
              echo "OBJCOPY=aarch64-linux-gnu-objcopy" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-2.32.8.tar.gz"
          tar -xzf SDL2.tar.gz
          case "${{ matrix.architecture }}" in
            x86)
              PROCESSOR=i686
              ;;
            x86_64)
              PROCESSOR=x86_64
              ;;
            arm64)
              PROCESSOR=aarch64
              ;;
          esac
          cat > linux-toolchain.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR $PROCESSOR)
          set(CMAKE_C_COMPILER "$CC")
          set(CMAKE_CXX_COMPILER "$CXX")
          set(CMAKE_AR "${CC%-gcc}-ar")
          set(CMAKE_RANLIB "${CC%-gcc}-ranlib")
          set(CMAKE_STRIP "${CC%-gcc}-strip")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF
          cmake -S "SDL2-2.32.8" -B sdl2-build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/linux-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-${{ matrix.architecture }}" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "SDL2_CFLAGS=-I$PWD/sdl2-${{ matrix.architecture }}/include -I$PWD/sdl2-${{ matrix.architecture }}/include/SDL2" >> "$GITHUB_ENV"
          echo "SDL2_LIBS=-L$PWD/sdl2-${{ matrix.architecture }}/lib -lSDL2" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make CC="$CC" OBJCOPY="$OBJCOPY" SDL2_CFLAGS="$SDL2_CFLAGS" SDL2_LIBS="$SDL2_LIBS"

      - name: Compress build output
        run: |
          mkdir -p release
          for file in build/output/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            7z a "release/${package}.7z" "$file"
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*.7z
          fail_on_unmatched_files: true

  android:
    name: Android
    runs-on: ubuntu-24.04

    env:
      # Android has no official SDL2 package; the requirement is providing it
      # somehow, so this builds it from its official source for each ABI.
      SDL2_VERSION: 2.32.8
      NDK_VERSION: 27.3.13750724
      NDK_PLATFORM: android-21

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            cmake \
            curl \
            p7zip-full

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.architecture }} \
            -DANDROID_PLATFORM=$NDK_PLATFORM \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-android" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "---- installed SDL2 files ----"
          find "$PWD/sdl2-android" -type f
          # Different SDL2 releases have installed SDL.h either directly under
          # include/SDL2/ or under plain include/; add both search paths so
          # <SDL.h> resolves either way instead of guessing which applies here.
          echo "SDL2_CFLAGS=-I$PWD/sdl2-android/include -I$PWD/sdl2-android/include/SDL2" >> "$GITHUB_ENV"
          echo "SDL2_LIBS=-L$PWD/sdl2-android/lib -lSDL2" >> "$GITHUB_ENV"

      # The engine's own source also has to be compiled with the NDK's
      # cross compiler for this ABI (not the host gcc used above for
      # build_tools/), or it cannot link against the Android SDL2 built
      # just above: same CPU architecture is not the same as the same
      # platform (Android's Bionic libc differs from Linux's glibc).
      - name: Select Android cross compiler for ${{ matrix.architecture }}
        run: |
          case "${{ matrix.architecture }}" in
            armeabi-v7a) TRIPLE=armv7a-linux-androideabi ;;
            arm64-v8a)   TRIPLE=aarch64-linux-android ;;
            x86)         TRIPLE=i686-linux-android ;;
            x86_64)      TRIPLE=x86_64-linux-android ;;
          esac
          API="${NDK_PLATFORM#android-}"
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC=$BIN/$TRIPLE$API-clang" >> "$GITHUB_ENV"
          echo "OBJCOPY=$BIN/llvm-objcopy" >> "$GITHUB_ENV"

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          make CC="$CC" OBJCOPY="$OBJCOPY" SDL2_CFLAGS="$SDL2_CFLAGS" SDL2_LIBS="$SDL2_LIBS"

      - name: Compress build output
        run: |
          mkdir -p release
          for file in build/output/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            7z a "release/${package}.7z" "$file"
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*.7z
          fail_on_unmatched_files: true

  macos:
    name: macOS
