name: Build Rebax

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VERSION: 2.32.8
  
  RELEASE_TAG: v0.0.5

jobs:


  prepare-release:
    name: Prepare release (delete old assets)
    runs-on: ubuntu-24.04
    steps:
      - name: Delete all existing assets in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          tag="${{ env.RELEASE_TAG }}"
          if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            assets=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
            if [ -n "$assets" ]; then
              while IFS= read -r asset; do
                echo "Deleting asset: $asset"
                gh release delete-asset "$tag" "$asset" --repo "$repo" -y
              done <<< "$assets"
            else
              echo "No assets to delete."
            fi
          else
            echo "Release $tag does not exist yet; nothing to delete."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the release tag to the latest commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}" --force

  windows:
    name: Windows
    runs-on: windows-2025
    needs: prepare-release

    env:
      LLVM_MINGW_TAG: 20260505

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        shell: pwsh
        run: |
          choco install -y 7zip make ninja cmake

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI target file
        run: |
          printf 'platform=windows\narch=${{ matrix.architecture }}\n' > .rebax-target






      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Install llvm-mingw (cross compiler for all 3 Windows architectures)
        shell: bash
        run: |
          curl -fL --retry 3 -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-x86_64.zip"
          7z x llvm-mingw.zip -ollvm-mingw-extracted > /dev/null
          dir=$(ls -d llvm-mingw-extracted/*/)
          echo "LLVM_MINGW=$PWD/${dir%/}" >> "$GITHUB_ENV"


          

      - name: Select cross compiler for ${{ matrix.architecture }}
        shell: bash
        run: |
          case "${{ matrix.architecture }}" in
            x86)    TRIPLE=i686-w64-mingw32 ;;
            x86_64) TRIPLE=x86_64-w64-mingw32 ;;
            arm64)  TRIPLE=aarch64-w64-mingw32 ;;
          esac
          echo "TRIPLE=$TRIPLE" >> "$GITHUB_ENV"
          echo "CC=$LLVM_MINGW/bin/$TRIPLE-clang.exe" >> "$GITHUB_ENV"
          echo "RC=$LLVM_MINGW/bin/$TRIPLE-windres.exe" >> "$GITHUB_ENV"

          

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        shell: bash
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build -G "Ninja" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.architecture }} \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_RC_COMPILER="$RC" \
            -DCMAKE_CROSSCOMPILING=TRUE \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-windows" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl2-build
          cmake --install sdl2-build
          echo "---- installed SDL2 files ----"
          find "$PWD/sdl2-windows" -type f

      - name: Build
        shell: bash
        run: |
          "/c/ProgramData/chocolatey/lib/make/tools/install/bin/make.exe"

      - name: Compress build output
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          outputs=(build/output/*)
          if [ ${#outputs[@]} -eq 0 ]; then
            echo "::error::No file was produced in build/output; the Build step must have failed. Refusing to package or upload." >&2
            exit 1
          fi
          repo_root="$PWD"
          for file in "${outputs[@]}"; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            (cd build/output && 7z a "$repo_root/release/${package}.7z" "$base")
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z
          fail_on_unmatched_files: true


  linux:
    name: Linux
    runs-on: ubuntu-24.04
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            cmake \
            libsdl2-dev \
            curl \
            p7zip-full
          case "${{ matrix.architecture }}" in
            x86)
              sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu libc6-dev-i386-cross
              ;;
            arm64)
              sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
              ;;
          esac

      - name: Select compiler for ${{ matrix.architecture }}
        run: |
          case "${{ matrix.architecture }}" in
            x86)
              echo "CC=i686-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            arm64)
              echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            x86_64)
              echo "CC=gcc" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI target file
        run: |
          printf 'platform=linux\narch=${{ matrix.architecture }}\n' > .rebax-target

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        if: matrix.architecture != 'x86_64'
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-linux" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_LIBSAMPLERATE=OFF
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "---- installed SDL2 files ----"
          find "$PWD/sdl2-linux" -type f

      - name: Build
        run: |
          make

      - name: Compress build output
        run: |
          mkdir -p release
          shopt -s nullglob
          outputs=(build/output/*)
          if [ ${#outputs[@]} -eq 0 ]; then
            echo "::error::No file was produced in build/output; the Build step must have failed. Refusing to package or upload." >&2
            exit 1
          fi
          repo_root="$PWD"
          for file in "${outputs[@]}"; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            (cd build/output && 7z a "$repo_root/release/${package}.7z" "$base")
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z
          fail_on_unmatched_files: true


  android:
    name: Android
    runs-on: ubuntu-24.04
    needs: prepare-release

    env:
      NDK_VERSION: 27.3.13750724
      NDK_PLATFORM: android-21

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            cmake \
            curl \
            p7zip-full

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.architecture }} \
            -DANDROID_PLATFORM=$NDK_PLATFORM \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-android" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "---- installed SDL2 files ----"
          find "$PWD/sdl2-android" -type f

      - name: Select Android cross compiler for ${{ matrix.architecture }}
        run: |
          case "${{ matrix.architecture }}" in
            armeabi-v7a) TRIPLE=armv7a-linux-androideabi ;;
            arm64-v8a)   TRIPLE=aarch64-linux-android ;;
            x86)         TRIPLE=i686-linux-android ;;
            x86_64)      TRIPLE=x86_64-linux-android ;;
          esac
          API="${NDK_PLATFORM#android-}"
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC=$BIN/$TRIPLE$API-clang" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI target file
        run: |
          printf 'platform=android\narch=${{ matrix.architecture }}\n' > .rebax-target

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          make

      - name: Compress build output
        run: |
          mkdir -p release
          shopt -s nullglob
          outputs=(build/output/*)
          if [ ${#outputs[@]} -eq 0 ]; then
            echo "::error::No file was produced in build/output; the Build step must have failed. Refusing to package or upload." >&2
            exit 1
          fi
          repo_root="$PWD"
          for file in "${outputs[@]}"; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            (cd build/output && 7z a "$repo_root/release/${package}.7z" "$base")
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z
          fail_on_unmatched_files: true


  macos:
    name: macOS
    runs-on: macos-14
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86_64
          - arm64

    steps:
      - name: Install requirements
        run: |
          brew install cmake curl p7zip llvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI target file
        run: |
          printf 'platform=macos\narch=${{ matrix.architecture }}\n' > .rebax-target

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Select compiler for ${{ matrix.architecture }}
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "CC=clang -arch ${{ matrix.architecture }} -isysroot $SDKROOT -mmacosx-version-min=11.0" >> "$GITHUB_ENV"

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-macos" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "---- installed SDL2 files ----"
          find "$PWD/sdl2-macos" -type f

      - name: Build
        run: |
          make

      - name: Compress build output
        run: |
          mkdir -p release
          shopt -s nullglob
          outputs=(build/output/*)
          if [ ${#outputs[@]} -eq 0 ]; then
            echo "::error::No file was produced in build/output; the Build step must have failed. Refusing to package or upload." >&2
            exit 1
          fi
          repo_root="$PWD"
          for file in "${outputs[@]}"; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            (cd build/output && 7z a "$repo_root/release/${package}.7z" "$base")
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z


  ios:
    name: iOS
    runs-on: macos-14
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x86_64

    steps:
      - name: Install requirements
        run: |
          brew install cmake curl p7zip llvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI target file
        run: |
          printf 'platform=ios\narch=${{ matrix.architecture }}\n' > .rebax-target

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Select compiler for ${{ matrix.architecture }}
        run: |
          if [ "${{ matrix.architecture }}" = "arm64" ]; then
            SDK=iphoneos
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
            echo "CC=clang -arch arm64 -isysroot $SDKROOT -mios-version-min=13.0" >> "$GITHUB_ENV"
              else
            SDK=iphonesimulator
            SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
            echo "CC=clang -arch x86_64 -isysroot $SDKROOT -mios-simulator-version-min=13.0" >> "$GITHUB_ENV"
              fi
          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"
          echo "IOS_SDKROOT=$SDKROOT" >> "$GITHUB_ENV"

      - name: Build SDL2 for ${{ matrix.architecture }} from source
        run: |
          curl -fL --retry 3 -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDKROOT" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-ios" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "---- installed SDL2 files ----"
          find "$PWD/sdl2-ios" -type f

      - name: Build
        run: |
          make

      - name: Compress build output
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          outputs=(build/output/*)
          if [ ${#outputs[@]} -eq 0 ]; then
            echo "::error::No file was produced in build/output; the Build step must have failed. Refusing to package or upload." >&2
            exit 1
          fi
          repo_root="$PWD"
          for file in "${outputs[@]}"; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            package="${base//_/-}"
            (cd build/output && 7z a "$repo_root/release/${package}.7z" "$base")
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z
          fail_on_unmatched_files: true
