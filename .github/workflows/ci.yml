name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, platform: android, arch: all }
          - { runner: ubuntu-26.04, platform: linux, arch: x86_64 }
          - { runner: ubuntu-26.04, platform: linux, arch: x86 }
          - { runner: ubuntu-26.04, platform: linux, arch: arm64 }
          - { runner: ubuntu-26.04, platform: linux, arch: arm }
          - { runner: windows-2025, platform: windows, arch: x86_64 }
          - { runner: windows-2025, platform: windows, arch: x86 }
          - { runner: windows-2025, platform: windows, arch: arm64 }
          - { runner: windows-2025, platform: windows, arch: arm }
          - { runner: macos-26-intel, platform: macos, arch: x86_64 }
          - { runner: macos-26-intel, platform: macos, arch: arm64 }
          - { runner: macos-26-intel, platform: ios, arch: x86_64 }
          - { runner: macos-26-intel, platform: ios, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y make

      - name: Install make on macOS
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) MAKE_BIN="/c/ProgramData/chocolatey/lib/make/tools/install/bin/make.exe" ;;
            macOS) MAKE_BIN=gmake ;;
            *) MAKE_BIN=make ;;
          esac
          "$MAKE_BIN" ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Check the output
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          base="build/output/Rebax-Engine-${version}-${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            android) test -f "${base}-universal.apk" ;;
            ios) test -f "${base}-${{ matrix.arch }}.ipa" ;;
            *) test -d "${base}-${{ matrix.arch }}" ;;
          esac
