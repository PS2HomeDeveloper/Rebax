name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, platform: android, arch: all }
          - { runner: ubuntu-26.04, platform: linux, arch: x86_64 }
          - { runner: ubuntu-26.04, platform: linux, arch: x86 }
          - { runner: ubuntu-26.04, platform: linux, arch: arm64 }
          - { runner: ubuntu-26.04, platform: linux, arch: arm }
          - { runner: windows-2025, platform: windows, arch: x86_64 }
          - { runner: windows-2025, platform: windows, arch: x86 }
          - { runner: windows-2025, platform: windows, arch: arm64 }
          - { runner: windows-2025, platform: windows, arch: arm }
          - { runner: macos-26-intel, platform: macos, arch: x86_64 }
          - { runner: macos-26-intel, platform: macos, arch: arm64 }
          - { runner: macos-26-intel, platform: ios, arch: x86_64 }
          - { runner: macos-26-intel, platform: ios, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            choco install -y make
            if (Test-Path "C:\ProgramData\chocolatey\lib\make\tools\install\bin\make.exe") { exit 0 }
            Start-Sleep -Seconds (15 * $i)
          }
          exit 1

      - name: Install make on macOS
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) MAKE_BIN="/c/ProgramData/chocolatey/lib/make/tools/install/bin/make.exe" ;;
            macOS) MAKE_BIN=gmake ;;
            *) MAKE_BIN=make ;;
          esac
          if [ "${{ matrix.platform }}" = "android" ]; then
            "$MAKE_BIN" android universal
            "$MAKE_BIN" android all
          else
            "$MAKE_BIN" ${{ matrix.platform }} ${{ matrix.arch }}
          fi

      - name: Check the output
        shell: bash
        run: |
          version=$(grep -m1 '^ENGINE_VERSION' Makefile | sed -E 's/^ENGINE_VERSION[[:space:]]*:=[[:space:]]*//')
          base="build/output/Rebax-Engine-${version}-${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            android) test -f "${base}-universal.apk" && test -f "${base}-arm64-v8a.apk" && test -f "${base}-armeabi-v7a.apk" && test -f "${base}-x86.apk" && test -f "${base}-x86_64.apk" ;;
            ios) test -f "${base}-${{ matrix.arch }}.ipa" || test -f "${base}-${{ matrix.arch }}.zip" ;;
            *) test -d "${base}-${{ matrix.arch }}" ;;
          esac

      - name: Check Native sample headlessly
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          engine=$(find build/output -type f -perm -111 -name 'Rebax-Engine-*' | head -n 1)
          test -n "$engine"
          "$engine" check tests/native_sample linux x86_64

      - name: Upload the build
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: build/output
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android universal
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: build/output/*-universal.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android arm64-v8a
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: build/output/*-arm64-v8a.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android armeabi-v7a
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-armeabi-v7a
          path: build/output/*-armeabi-v7a.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android x86
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-x86
          path: build/output/*-x86.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android x86_64
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-x86_64
          path: build/output/*-x86_64.apk
          retention-days: 7
          if-no-files-found: error
